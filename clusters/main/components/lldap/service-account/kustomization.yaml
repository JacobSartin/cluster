---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ldap-service-account.yaml
patches:
  - target:
      version: v1
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: unused
        labels:
          network.jacobsartin.com/lldap: client
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          group: generators.external-secrets.io
          kind: Password
          name: lldap-service-account
        fieldPaths:
          - metadata.namespace
        options:
          create: true
      - select:
          group: external-secrets.io
          kind: ExternalSecret
          name: lldap-service-account
        fieldPaths:
          - metadata.namespace
        options:
          create: true
