---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../service-account
patches:
  - target:
      group: external-secrets.io
      kind: ExternalSecret
      name: lldap-service-account
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: lldap-service-account
      spec:
        target:
          template:
            data:
              readonly: "true"
