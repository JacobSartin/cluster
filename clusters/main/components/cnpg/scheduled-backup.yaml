---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-daily
spec:
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  # Waits for the upgraded primary after a major upgrade.
  immediate: true
  # Standby backups require a primary WAL switch before recovery.
  target: primary
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: postgres
