---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: unused
spec:
  retentionPolicy: 30d
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
  configuration:
    endpointURL: http://${RUSTFS_URL}
    s3Credentials:
      accessKeyId:
        key: ACCESS_KEY_ID
      secretAccessKey:
        key: ACCESS_SECRET_KEY
    data:
      compression: bzip2
    wal:
      compression: bzip2
