apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgadmin
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
    - name: gateway-api-crds
    - name: traefik-internal
  interval: 10m
  path: clusters/main/kubernetes/apps/pgadmin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
