apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - credentials.yaml
  - helm-release.yaml
  - network-policy.yaml
  - rbac.yaml

components:
  - ../../../../components/traefik/authelia

configMapGenerator:
  - name: pgadmin-values
    namespace: pgadmin
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
  - name: pgadmin-servers-script
    namespace: pgadmin
    files:
      - servers.py
    options:
      disableNameSuffixHash: true
