# renovate-schema: datasource=docker depName=ghcr.io/bjw-s-labs/helm/app-template registryUrl=https://ghcr.io
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/values.schema.json
---
controllers:
  main:
    forceRename: pgadmin
    strategy: Recreate

    pod:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568

      automountServiceAccountToken: true

    initContainers:
      servers:
        image:
          repository: docker.io/dpage/pgadmin4
          tag: 9.19@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83

        command:
          - /venv/bin/python3
          - /scripts/servers.py
          - /var/lib/pgadmin/servers.json
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add: []
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 5050
          runAsNonRoot: true
          runAsUser: 5050
          seccompProfile:
            type: RuntimeDefault

    containers:
      main:
        image:
          repository: docker.io/dpage/pgadmin4
          tag: 9.19@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83

        env:
          TZ: ${TZ}
          PGADMIN_DEFAULT_EMAIL: pgadmin@${BASE_DOMAIN}
          PGADMIN_DEFAULT_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: pgadmin-credentials
                key: password
          PGADMIN_LISTEN_PORT: "8080"
          PGADMIN_LISTEN_ADDRESS: 0.0.0.0
          PGADMIN_SERVER_JSON_FILE: /var/lib/pgadmin/servers.json
          PGADMIN_CONFIG_AUTHENTICATION_SOURCES: "['webserver']"
          PGADMIN_CONFIG_WEBSERVER_REMOTE_USER: "'Remote-User'"
          PGADMIN_CONFIG_WEBSERVER_REMOTE_USER_FROM_HEADER: "True"
          PGADMIN_CONFIG_WEBSERVER_TRUSTED_PROXIES: "['${PODNET}']"
          PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                port: 8080
                path: /misc/ping
                scheme: HTTP
              initialDelaySeconds: 10
              failureThreshold: 60
              successThreshold: 1
              timeoutSeconds: 3
              periodSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                port: 8080
                path: /misc/ping
                scheme: HTTP
              initialDelaySeconds: 10
              failureThreshold: 4
              successThreshold: 2
              timeoutSeconds: 5
              periodSeconds: 12
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                port: 8080
                path: /misc/ping
                scheme: HTTP
              initialDelaySeconds: 12
              failureThreshold: 5
              successThreshold: 1
              timeoutSeconds: 5
              periodSeconds: 15

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add: []
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 5050
          runAsNonRoot: true
          runAsUser: 5050
          seccompProfile:
            type: RuntimeDefault

        resources:
          requests:
            cpu: 75m
            memory: 200Mi
          limits:
            cpu: 1500m
            memory: 2400Mi

service:
  main:
    forceRename: pgadmin
    controller: main
    ports:
      main:
        port: 10024
        targetPort: 8080

route:
  main:
    kind: HTTPRoute
    labels:
      gateway-role: internal
    annotations:
      auth.jacobsartin.com/gatus-path: /misc/ping
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "PGAdmin"
      gethomepage.dev/group: "Tools"
      gethomepage.dev/icon: "pgadmin.svg"
      gethomepage.dev/href: "https://pgadmin.${BASE_DOMAIN}"
      gethomepage.dev/weight: "50"
    hostnames:
      - pgadmin.${BASE_DOMAIN}
    parentRefs:
      - name: internal
        namespace: traefik-internal
        sectionName: websecure
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: main
            port: 10024

persistence:
  config:
    type: emptyDir
    globalMounts:
      - path: /var/lib/pgadmin

  scripts:
    type: configMap
    name: pgadmin-servers-script
    advancedMounts:
      main:
        servers:
          - path: /scripts
            readOnly: true

  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
