apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bytestash-data
  namespace: bytestash
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: bytestash-data-data-dest
  resources:
    requests:
      storage: 1Gi
