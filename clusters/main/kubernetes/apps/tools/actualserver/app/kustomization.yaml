apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helm-release.yaml
  - pvc.yaml
  - volsync.yaml

components:
  - ../../../../../components/traefik/authelia

configMapGenerator:
  - name: actualserver-values
    namespace: actualserver
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
