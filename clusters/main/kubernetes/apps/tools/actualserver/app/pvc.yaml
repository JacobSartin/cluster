apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actualserver-data
  namespace: actualserver
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: actualserver-data-data-dest
  resources:
    requests:
      storage: 1Gi
