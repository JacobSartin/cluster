apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: it-tools
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api-crds
  interval: 10m
  path: clusters/main/kubernetes/apps/tools/it-tools/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster

