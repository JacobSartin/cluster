apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helm-release.yaml

components:
  - ../../../../../components/traefik/authelia

configMapGenerator:
  - name: stirling-pdf-values
    namespace: stirling-pdf
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
