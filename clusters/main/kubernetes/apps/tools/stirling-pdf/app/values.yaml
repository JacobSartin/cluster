# renovate-schema: datasource=docker depName=ghcr.io/bjw-s-labs/helm/app-template registryUrl=https://ghcr.io
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/values.schema.json
---
controllers:
  main:
    forceRename: stirling-pdf
    strategy: Recreate
    pod:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    containers:
      main:
        image:
          repository: ghcr.io/stirling-tools/s-pdf
          tag: 3.5.0-ultra-lite@sha256:352d0e8cbaca82ac59989875456935a33a554882f15466b5d6f93142ff9b0043

        env:
          TZ: ${TZ}
          DOCKER_ENABLE_SECURITY: "false"
          INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
          LANGS: en_US

        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                port: 8080
                path: /
                scheme: HTTP
              initialDelaySeconds: 10
              failureThreshold: 60
              successThreshold: 1
              timeoutSeconds: 3
              periodSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                port: 8080
                path: /
                scheme: HTTP
              initialDelaySeconds: 10
              failureThreshold: 4
              successThreshold: 2
              timeoutSeconds: 5
              periodSeconds: 12
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                port: 8080
                path: /
                scheme: HTTP
              initialDelaySeconds: 12
              failureThreshold: 5
              successThreshold: 1
              timeoutSeconds: 5
              periodSeconds: 15

        # The entrypoint requires root to set ownership and drop privileges.
        # TODO: Use non-root startup when upstream supports it.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - CHOWN
              - SETUID
              - SETGID
              - FOWNER
              - DAC_OVERRIDE
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault

        resources:
          requests:
            cpu: 75m
            memory: 200Mi
          limits:
            cpu: 1500m
            memory: 2400Mi

service:
  main:
    forceRename: stirling-pdf
    controller: main
    ports:
      main:
        port: 18080
        targetPort: 8080

route:
  main:
    kind: HTTPRoute
    labels:
      gateway-role: internal
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Stirling PDF"
      gethomepage.dev/group: "Tools"
      gethomepage.dev/icon: "stirling-pdf.svg"
      gethomepage.dev/href: "https://pdf.${BASE_DOMAIN}"
      gethomepage.dev/weight: "20"
    hostnames:
      - pdf.${BASE_DOMAIN}
    parentRefs:
      - name: internal
        namespace: traefik-internal
        sectionName: websecure
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: main
            port: 18080

persistence:
  configs:
    type: emptyDir
    sizeLimit: 256Mi
    globalMounts:
      - path: /configs

  custom-files:
    type: emptyDir
    sizeLimit: 64Mi
    globalMounts:
      - path: /customFiles

  logs:
    type: emptyDir
    sizeLimit: 256Mi
    globalMounts:
      - path: /logs

  tmp:
    type: emptyDir
    sizeLimit: 4Gi
    globalMounts:
      - path: /tmp/stirling-pdf
