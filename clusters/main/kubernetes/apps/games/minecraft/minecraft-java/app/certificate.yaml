---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: minecraft-java-bluemap-gateway
  namespace: minecraft
spec:
  secretName: minecraft-java-bluemap-gateway-tls
  dnsNames:
    - map.${BASE_DOMAIN}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: prod
    kind: ClusterIssuer
    group: cert-manager.io
