apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - certificate.yaml
  - pvc.yaml
  - helm-release.yaml
  - rcon.sops.yaml
  - motd.sops.yaml
  - restic.yaml
  - mods.yaml

components:
  - ../../../../../../components/codeserver
  - ../../../../../../components/traefik/authelia

configMapGenerator:
  - name: minecraft-java-codeserver-settings
    namespace: minecraft
    files:
      - settings.json=codeserver-settings.json
    options:
      disableNameSuffixHash: true
  - name: minecraft-java-values
    namespace: minecraft
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
