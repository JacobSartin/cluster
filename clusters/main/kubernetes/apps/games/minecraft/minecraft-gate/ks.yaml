---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minecraft-gate
  namespace: flux-system
spec:
  dependsOn:
    - name: minecraft-java
    - name: unifi-port-forward
    - name: metallb-pools
  interval: 10m
  path: clusters/main/kubernetes/apps/games/minecraft/minecraft-gate/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
