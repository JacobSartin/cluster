apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-release.yaml
  - network-policy.yaml
  - port-forward.yaml

configMapGenerator:
  - name: minecraft-gate-values
    namespace: minecraft
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
  - name: minecraft-gate-config
    namespace: minecraft
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
