apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: factorio-saves
  namespace: factorio
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factorio-saves-restic
  namespace: factorio
spec:
  refreshInterval: 1h
  target:
    name: factorio-saves-restic
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: "{{ .rustfsAccessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .rustfsSecretAccessKey }}"
        RESTIC_PASSWORD: '{{ if lt (len .resticRoot) 64 }}{{ .resticRootTooShort }}{{ end }}{{ printf "%s:factorio/factorio-saves-restic" .resticRoot | sha256sum }}'
        RESTIC_REPOSITORY: "s3:http://${RUSTFS_URL}/factorio-saves"
  data:
    - secretKey: rustfsAccessKeyId
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: rustfs-credentials
      remoteRef:
        key: rustfs-credentials
        property: access-key-id
    - secretKey: rustfsSecretAccessKey
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: rustfs-credentials
      remoteRef:
        key: rustfs-credentials
        property: secret-access-key
    - secretKey: resticRoot
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: backup
      remoteRef:
        key: backup
        property: restic-root
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: factorio-saves
  namespace: factorio
spec:
  sourcePVC: factorio-saves
  trigger:
    schedule: 0 0 * * *
  restic:
    repository: factorio-saves-restic
    copyMethod: Snapshot
    pruneIntervalDays: 7
    retain:
      hourly: 6
      daily: 5
      weekly: 4
      monthly: 3
      yearly: 1
    accessModes: [ReadWriteOnce]
    cacheCapacity: 1Gi
    moverSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
