apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helm-release.yaml
  - storage.yaml

configMapGenerator:
  - name: factorio-values
    namespace: factorio
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
  - name: factorio-settings
    namespace: factorio
    files:
      - server-settings.json
    options:
      disableNameSuffixHash: true
