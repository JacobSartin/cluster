apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: factorio
  namespace: flux-system
spec:
  dependsOn:
    - name: volsync
    - name: external-secrets-stores
    - name: longhorn
    - name: metallb-pools
  interval: 10m
  path: clusters/main/kubernetes/apps/games/factorio/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
