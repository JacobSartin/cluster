apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helm-release.yaml
  - storage.yaml
  - steam.sops.yaml
  - port-forward.yaml
components:
  - ../../../../../components/codeserver
  - ../../../../../components/traefik/authelia
configMapGenerator:
  - name: assettocorsa-codeserver-settings
    namespace: assettocorsa
    files:
      - settings.json=codeserver-settings.json
    options:
      disableNameSuffixHash: true
  - name: assettocorsa-values
    namespace: assettocorsa
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
