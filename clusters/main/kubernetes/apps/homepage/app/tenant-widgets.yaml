---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-widgets-reader
  namespace: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homepage-widgets-reader
  namespace: private-system

rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - homepage-widgets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homepage-widgets-reader
  namespace: private-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homepage-widgets-reader
subjects:
  - kind: ServiceAccount
    name: tenant-widgets-reader
    namespace: homepage
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tenant-widgets
  namespace: homepage
spec:
  provider:
    kubernetes:
      remoteNamespace: private-system
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: tenant-widgets-reader
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-tenant-widgets
  namespace: homepage
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: SecretStore
    name: tenant-widgets
  target:
    name: homepage-tenant-widgets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: homepage-widgets
