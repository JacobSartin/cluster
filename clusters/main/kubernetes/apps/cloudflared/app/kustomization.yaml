apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - network-policy.yaml
  - tunnel.sops.yaml
  - helm-release.yaml
  - prometheus-rule.yaml

configMapGenerator:
  - name: cloudflared-values
    namespace: cloudflared
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
  - name: cloudflared-config
    namespace: cloudflared
    files:
      - config/config.yaml
    options:
      disableNameSuffixHash: true
