apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-feature-discovery
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
  interval: 10m
  path: clusters/main/kubernetes/kube-system/node-feature-discovery/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-feature-discovery-dashboards
  namespace: flux-system
spec:
  dependsOn:
    - name: node-feature-discovery
    - name: grafana-operator
  interval: 10m
  path: clusters/main/kubernetes/kube-system/node-feature-discovery/dashboards
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
