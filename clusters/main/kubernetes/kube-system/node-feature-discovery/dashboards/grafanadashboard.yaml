---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: node-feature-discovery
  namespace: kube-system
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prometheus
  # renovate-dashboard: depName=kubernetes-sigs/node-feature-discovery datasource=github-releases
  url: https://raw.githubusercontent.com/kubernetes-sigs/node-feature-discovery/v0.20.1/examples/grafana-dashboard.json
  folder: Infrastructure
