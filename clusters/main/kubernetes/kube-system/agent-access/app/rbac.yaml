---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: agent
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-read

rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - acme.cert-manager.io
      - actions.github.com
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - autoscaling
      - barmancloud.cnpg.io
      - batch
      - capsule.clastix.io
      - cert-manager.io
      - certificates.k8s.io
      - cilium.io
      - coordination.k8s.io
      - deviceplugin.intel.com
      - discovery.k8s.io
      - events.k8s.io
      - external-secrets.io
      - externaldns.k8s.io
      - flowcontrol.apiserver.k8s.io
      - fluxcd.controlplane.io
      - fpga.intel.com
      - frrk8s.metallb.io
      - gateway.networking.k8s.io
      - generators.external-secrets.io
      - grafana.integreatly.org
      - groupsnapshot.storage.k8s.io
      - helm.toolkit.fluxcd.io
      - hub.traefik.io
      - kustomize.toolkit.fluxcd.io
      - longhorn.io
      - metallb.io
      - metrics.k8s.io
      - monitoring.coreos.com
      - monitoring.grafana.com
      - networking.k8s.io
      - nfd.k8s-sigs.io
      - node.k8s.io
      - notification.toolkit.fluxcd.io
      - policy
      - postgresql.cnpg.io
      - rbac.authorization.k8s.io
      - resource.k8s.io
      - scheduling.k8s.io
      - snapshot.storage.k8s.io
      - source.extensions.fluxcd.io
      - source.toolkit.fluxcd.io
      - storage.k8s.io
      - storagemigration.k8s.io
      - talos.dev
      - traefik.io
      - tuppr.home-operations.com
      - volsync.backube
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-view

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: agent
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-read

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-read
subjects:
  - kind: ServiceAccount
    name: agent
    namespace: kube-system
