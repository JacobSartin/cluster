apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
  interval: 10m
  path: clusters/main/kubernetes/kube-system/cilium/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster

