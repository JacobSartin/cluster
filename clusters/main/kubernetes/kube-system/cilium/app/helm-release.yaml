apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: cilium
    namespace: flux-system
  timeout: 20m
  driftDetection:
    mode: warn
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
