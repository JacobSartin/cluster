---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  dependsOn:
    - name: authelia-route-policy
  interval: 2h
  path: config/crd
  prune: false
  sourceRef:
    kind: GitRepository
    name: gateway-api
  wait: true
