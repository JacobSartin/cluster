---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.36.0/validatingadmissionpolicy-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: authelia-route
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        auth.jacobsartin.com/authelia: enabled
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
  matchConditions:
    - name: not-bypassed
      expression: >-
        object.metadata.?labels["auth.jacobsartin.com/authelia"].orValue("") != "bypass"
  variables:
    - name: probed
      expression: >-
        object.metadata.?annotations["gatus.home-operations.com/enabled"].orValue("") != "false"
    - name: path
      expression: >-
        object.metadata.?annotations["auth.jacobsartin.com/gatus-path"].orValue("")
    - name: expected
      expression: |-
        (variables.path == "" ? "" : "path: " + variables.path + "\n") +
          "headers:\n  Proxy-Authorization: Basic $${GATUS_AUTHELIA_BASIC}\n"
  validations:
    - expression: >-
        object.spec.?rules.orValue([]).all(rule,
          rule.?filters.orValue([]).exists(f,
            f.?type.orValue("") == "ExtensionRef" &&
            f.?extensionRef.?group.orValue("") == "traefik.io" &&
            f.?extensionRef.?kind.orValue("") == "Middleware" &&
            f.?extensionRef.?name.orValue("") == "authelia"))
      message: >-
        Every rule needs the authelia filter in this namespace. Label the route
        auth.jacobsartin.com/authelia=bypass to serve it without Authelia.
    - expression: >-
        variables.path == "" ||
        variables.path.matches(r'^/([A-Za-z0-9._~?=&%+-][A-Za-z0-9._~/?=&%+-]*)?$')
      message: >-
        auth.jacobsartin.com/gatus-path must be an absolute path, without "//", spaces or
        characters outside A-Z a-z 0-9 . _ ~ / ? = & % + -.
    - expression: >-
        !variables.probed ||
        object.metadata.?annotations["gatus.home-operations.com/endpoint"].orValue("") ==
          variables.expected
      message: >-
        The authelia-route policy owns gatus.home-operations.com/endpoint on protected routes;
        set a probe path with auth.jacobsartin.com/gatus-path instead.
    - expression: >-
        !variables.probed ||
        (object.spec.?hostnames.orValue([]).size() > 0 &&
          object.spec.hostnames.all(h, h == "${BASE_DOMAIN}" || h.endsWith(".${BASE_DOMAIN}")))
      message: >-
        A route Gatus probes through Authelia needs hostnames under ${BASE_DOMAIN}; set
        gatus.home-operations.com/enabled: "false" otherwise.
    - expression: >-
        !variables.probed ||
        object.spec.?parentRefs.orValue([]).all(p,
          p.?group.orValue("gateway.networking.k8s.io") == "gateway.networking.k8s.io" &&
          p.?kind.orValue("Gateway") == "Gateway" &&
          (
            (p.?namespace.orValue(object.metadata.namespace) == "traefik-internal" &&
              p.name == "internal") ||
            (p.?namespace.orValue(object.metadata.namespace) == "traefik-external" &&
              p.name == "external")
          ))
      message: >-
        A route Gatus probes through Authelia may only attach to the internal and external
        Gateways; set gatus.home-operations.com/enabled: "false" otherwise.
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.36.0/validatingadmissionpolicybinding-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: authelia-route
spec:
  policyName: authelia-route
  validationActions: ["Deny"]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.36.0/validatingadmissionpolicy-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gatus-endpoint-annotation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes", "gateways"]
  matchConditions:
    - name: has-endpoint-annotation
      expression: >-
        object.metadata.?annotations["gatus.home-operations.com/endpoint"].hasValue()
  variables:
    - name: endpoint
      expression: >-
        object.metadata.annotations["gatus.home-operations.com/endpoint"]
    - name: protectedRoute
      expression: >-
        request.resource.resource == "httproutes" &&
        namespaceObject != null &&
        namespaceObject.metadata.?labels["auth.jacobsartin.com/authelia"].orValue("") ==
          "enabled" &&
        object.metadata.?labels["auth.jacobsartin.com/authelia"].orValue("") != "bypass"
    - name: path
      expression: >-
        object.metadata.?annotations["auth.jacobsartin.com/gatus-path"].orValue("")
    - name: generated
      expression: |-
        (variables.path == "" ? "" : "path: " + variables.path + "\n") +
          "headers:\n  Proxy-Authorization: Basic $${GATUS_AUTHELIA_BASIC}\n"
  validations:
    - expression: >-
        !variables.endpoint.contains("$") ||
        (variables.protectedRoute && variables.endpoint == variables.generated)
      message: >-
        gatus.home-operations.com/endpoint may not contain "$": Gatus would expand it from its
        own environment.
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.36.0/validatingadmissionpolicybinding-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gatus-endpoint-annotation
spec:
  policyName: gatus-endpoint-annotation
  validationActions: ["Deny"]
