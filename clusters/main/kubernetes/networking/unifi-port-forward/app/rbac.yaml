---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unifi-port-forward

rules:
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - unifi-port-forward.fiskhe.st
    resources:
      - portforwardrules
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - unifi-port-forward.fiskhe.st
    resources:
      - portforwardrules/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - unifi-port-forward.fiskhe.st
    resources:
      - portforwardrules/finalizers
    verbs:
      - update
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unifi-port-forward

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: unifi-port-forward
subjects:
  - kind: ServiceAccount
    name: unifi-port-forward
    namespace: unifi-port-forward
