apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crd.yaml
  - namespace.yaml
  - prometheus-rule.yaml
  - secret.sops.yaml
  - rbac.yaml
  - helm-release.yaml

configMapGenerator:
  - name: unifi-port-forward-values
    namespace: unifi-port-forward
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
