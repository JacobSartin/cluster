apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unifi-port-forward
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
  interval: 10m
  path: clusters/main/kubernetes/networking/unifi-port-forward/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
