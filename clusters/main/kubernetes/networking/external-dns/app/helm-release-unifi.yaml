---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-unifi
  namespace: external-dns
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: external-dns
    namespace: flux-system
  values:
    fullnameOverride: external-dns-unifi
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          tag: 0.11.0@sha256:663442f116d7b45546782bdf7ace50d05ac15cc630c7236d443d69593845e992
        env:
          - name: UNIFI_HOST
            value: https://${GATEWAY}
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: external-dns-unifi
                key: UNIFI_API_KEY
          - name: READINESS_CACHE_TTL
            value: 5m
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
    # Follows routes whose parent is a ListenerSet; without it their records are deleted.
    enableGatewayListenerSets: true
    sources:
      - gateway-httproute
      - service
    annotationFilter: network.jacobsartin.com/dns in (local)
    policy: sync
    registry: txt
    txtOwnerId: main-unifi
    txtPrefix: k8s.main.%{record_type}-
    domainFilters:
      - ${BASE_DOMAIN}
    interval: 5m
    triggerLoopOnEvent: true
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
