apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-dns
  namespace: external-dns
spec:
  groups:
    - name: external-dns.health
      rules:
        - alert: ExternalDnsSyncStale
          expr: time() - max by (namespace, job) (external_dns_controller_last_sync_timestamp_seconds{namespace="external-dns"}) > 1800
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} has not completed a sync for 30 minutes"
            description: Check the controller logs and, for external-dns-unifi, the webhook sidecar and the UniFi Network app.

        - alert: ExternalDnsErrors
          expr: |
            sum by (namespace, job) (
              increase(external_dns_source_errors_total{namespace="external-dns"}[10m])
              + increase(external_dns_registry_errors_total{namespace="external-dns"}[10m])
            ) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} keeps failing to read sources or its DNS provider"
            description: Errors in every 10-minute window for 15 minutes; a shorter provider outage stays pending.

        - alert: ExternalDnsMetricsMissing
          expr: absent(external_dns_controller_last_sync_timestamp_seconds{namespace="external-dns",job="external-dns-unifi"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: external-dns-unifi metrics are missing
            description: Check the external-dns-unifi Deployment, ServiceMonitor, and Prometheus target.
