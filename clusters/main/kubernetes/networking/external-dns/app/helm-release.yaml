---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: external-dns
    namespace: flux-system
  values:
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-cloudflare
            key: apiToken
    # Follows routes whose parent is a ListenerSet; without it their records are deleted.
    enableGatewayListenerSets: true
    sources:
      - gateway-httproute
    policy: sync
    registry: txt
    txtOwnerId: main
    domainFilters:
      - ${BASE_DOMAIN}
    extraArgs:
      - --gateway-name=external
      - --gateway-namespace=traefik-external
      - --cloudflare-proxied
      # Own prefix: the Gateway's tunnel target annotation is hidden from external-dns-unifi.
      - --annotation-prefix=cloudflare.external-dns.kubernetes.io/
      # Drops records that would publish a private address if the tunnel target is missing.
      - --exclude-target-net=10.0.0.0/8
      - --exclude-target-net=172.16.0.0/12
      - --exclude-target-net=192.168.0.0/16
    triggerLoopOnEvent: true
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
