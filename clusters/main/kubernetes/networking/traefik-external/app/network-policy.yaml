---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-external-egress
  namespace: traefik-external
spec:
  description: Traefik to the backends of the namespaces it serves
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.network.jacobsartin.com/ingress: external
