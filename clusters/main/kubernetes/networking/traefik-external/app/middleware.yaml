---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/traefik.io/middleware_v1alpha1.json
# trustDnsName and clusterCidr replace this list.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflarewarp
  namespace: traefik-external
  labels:
    gateway-role: external
spec:
  plugin:
    cloudflarewarp:
      disableDefault: true
      trustip:
        - ${PODNET}
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/traefik.io/middleware_v1alpha1.json
# HSTS; hides the backend Server and X-Powered-By headers.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: traefik-external
  labels:
    gateway-role: external
spec:
  headers:
    stsSeconds: 31449600
    stsIncludeSubdomains: true
    customResponseHeaders:
      Server: ""
      X-Powered-By: ""
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/traefik.io/middleware_v1alpha1.json
# Text only, to spare tunnel upload; media passes through.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: traefik-external
  labels:
    gateway-role: external
spec:
  compress:
    encodings:
      - br
      - gzip
    includedContentTypes:
      - application/javascript
      - application/json
      - application/manifest+json
      - application/xml
      - image/svg+xml
      - text/css
      - text/html
      - text/javascript
      - text/plain
      - text/xml
