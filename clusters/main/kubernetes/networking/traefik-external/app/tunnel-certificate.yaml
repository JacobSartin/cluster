---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
# The tunnel listener must reference a certificate; each host is served its own by SNI.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tunnel-listener
  namespace: traefik-external
spec:
  secretName: tunnel-listener-tls
  dnsNames:
    - traefik-external-tunnel.traefik-external.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
