---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-external
  namespace: flux-system
spec:
  dependsOn:
    - name: clusterissuer
    - name: gateway-api-crds
    - name: prometheus-operator-crds
    - name: metallb-config
    - name: traefik-internal
  interval: 10m
  path: clusters/main/kubernetes/networking/traefik-external/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
