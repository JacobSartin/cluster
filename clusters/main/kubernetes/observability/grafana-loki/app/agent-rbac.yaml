---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-loki-query
  namespace: grafana-loki

rules:
  - apiGroups:
      - ""
    resources:
      - services/proxy
    resourceNames:
      - grafana-loki:3100
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-loki-query
  namespace: grafana-loki

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-loki-query
subjects:
  - kind: ServiceAccount
    name: agent
    namespace: kube-system
