apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-loki
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-stores
    - name: prometheus-operator-crds
    - name: longhorn
  interval: 10m
  path: clusters/main/kubernetes/observability/grafana-loki/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-loki-dashboards
  namespace: flux-system
spec:
  dependsOn:
    - name: grafana-loki
    - name: grafana-operator
  interval: 10m
  path: clusters/main/kubernetes/observability/grafana-loki/dashboards
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
