---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
    - name: prometheus-operator-crds
    - name: traefik-internal
    - name: longhorn
  interval: 10m
  path: clusters/main/kubernetes/observability/gatus/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
