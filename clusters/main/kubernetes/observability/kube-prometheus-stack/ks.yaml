apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
    - name: gateway-api-crds
    - name: grafana-operator
    - name: kube-prometheus-stack-node-exporter
    - name: traefik-internal
    - name: longhorn
  interval: 10m
  path: clusters/main/kubernetes/observability/kube-prometheus-stack/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-dashboards
  namespace: flux-system
spec:
  dependsOn:
    - name: kube-prometheus-stack
    - name: grafana-operator
  interval: 10m
  path: clusters/main/kubernetes/observability/kube-prometheus-stack/dashboards
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-node-exporter
  namespace: flux-system
spec:
  interval: 10m
  path: clusters/main/kubernetes/observability/kube-prometheus-stack/node-exporter
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
