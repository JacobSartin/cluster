---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
  namespace: kube-prometheus-stack
spec:
  route:
    receiver: discord
    groupBy: ["alertname"]
    groupWait: 1m
    groupInterval: 10m
    repeatInterval: 12h
    routes:
      - receiver: healthchecks
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
        groupWait: 0s
        groupInterval: 1m
        repeatInterval: 1m
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      - receiver: "null"
        matchers:
          - name: severity
            value: info
            matchType: =
  inhibitRules:
    - equal: ["alertname", "namespace"]
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
  receivers:
    - name: "null"
    - name: healthchecks
      webhookConfigs:
        - urlSecret:
            name: alertmanager-secret
            key: HEALTHCHECKS_WATCHDOG_URL
          sendResolved: false
          maxAlerts: 1
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-secret
            key: DISCORD_WEBHOOK_URL
          sendResolved: true
          title: >-
            {{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }}
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}
          message: |-
            {{- range .Alerts }}
            **{{ .Labels.severity | toUpper }}**
            {{- if ne .Annotations.summary "" }} {{ .Annotations.summary }}
            {{- else if ne .Annotations.message "" }} {{ .Annotations.message }}
            {{- else }} {{ .Labels.alertname }}
            {{- end }}
            {{- if ne .Annotations.description "" }}
            {{ .Annotations.description }}
            {{- end }}
            {{- if .Labels.namespace }}
            `{{ .Labels.namespace }}{{ if .Labels.pod }}/{{ .Labels.pod }}{{ else if .Labels.name }}/{{ .Labels.name }}{{ end }}`
            {{- end }}
            {{- if .Labels.instance }} `{{ .Labels.instance }}`{{ end }}
            {{- if .Labels.node }} `{{ .Labels.node }}`{{ end }}
            {{- if eq .Status "firing" }} since <t:{{ .StartsAt.Unix }}:R>{{ else }} resolved <t:{{ .EndsAt.Unix }}:R>{{ end }}
            {{ end }}
            [Alertmanager]({{ .ExternalURL }})
