---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-prometheus-query
  namespace: kube-prometheus-stack

rules:
  - apiGroups:
      - ""
    resources:
      - services/proxy
    resourceNames:
      - kube-prometheus-stack-prometheus:9090
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-prometheus-query
  namespace: kube-prometheus-stack

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-prometheus-query
subjects:
  - kind: ServiceAccount
    name: agent
    namespace: kube-system
