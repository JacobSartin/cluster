apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - controller.sops.yaml
  - helm-release.yaml
  - prometheus-rule.yaml

configMapGenerator:
  - name: unpoller-values
    namespace: unpoller
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
