apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helm-release.yaml
  - prometheus-rule.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: alloy-config
    namespace: grafana-alloy
    files:
      - config.alloy=config.alloy
