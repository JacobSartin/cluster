apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: headlamp
    namespace: flux-system
  timeout: 20m
  driftDetection:
    mode: warn

  values:
    config:
      unsafeUseServiceAccountToken: true
      watchPlugins: true
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
    pluginsManager:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
      configContent: |
        plugins:
          - name: flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            # renovate: datasource=docker depName=ghcr.io/headlamp-k8s/headlamp-plugin-flux
            version: 0.7.0
          - name: cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            # renovate: datasource=docker depName=ghcr.io/headlamp-k8s/headlamp-plugin-cert-manager
            version: 0.1.0

    service:
      type: ClusterIP

    httpRoute:
      enabled: true
      labels:
        gateway-role: internal
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Headlamp"
        gethomepage.dev/group: "Metrics"
        gethomepage.dev/icon: "headlamp.svg"
        gethomepage.dev/href: "https://headlamp.${BASE_DOMAIN}"
        gethomepage.dev/weight: "30"
        gethomepage.dev/app: "headlamp"
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: internal
          namespace: traefik-internal
          sectionName: websecure
      hostnames:
        - headlamp.${BASE_DOMAIN}
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - group: ""
              kind: Service
              name: headlamp
              port: 80
