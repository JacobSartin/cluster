apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api-crds
    - name: traefik-internal
  interval: 10m
  path: clusters/main/kubernetes/observability/headlamp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
