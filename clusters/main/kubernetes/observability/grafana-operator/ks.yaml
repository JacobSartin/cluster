---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
  interval: 10m
  path: clusters/main/kubernetes/observability/grafana-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-instance
  namespace: flux-system
spec:
  dependsOn:
    - name: grafana-operator
    - name: cloudnative-pg-barman-plugin
    - name: cloudnative-pg-image-catalog
    - name: external-secrets
    - name: external-secrets-stores
    - name: longhorn
  interval: 10m
  path: clusters/main/kubernetes/observability/grafana-operator/instance
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: true
