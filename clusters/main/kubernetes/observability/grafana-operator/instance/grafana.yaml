---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana-operator
  labels:
    dashboards: grafana
spec:
  # renovate: datasource=docker depName=docker.io/grafana/grafana
  version: "13.3.2"
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "true"
    auth.basic:
      enabled: "false"
    auth.jwt:
      enabled: "true"
      header_name: Authorization
      expect_claims: '{"aud": ["operator.grafana.com"]}'
      username_claim: sub
      email_claim: sub
      auto_sign_up: "true"
      role_attribute_strict: "true"
      role_attribute_path: "sub == 'system:serviceaccount:grafana-operator:grafana-operator' && 'GrafanaAdmin' || ''"
      allow_assign_grafana_admin: "true"
      jwk_set_url: https://kubernetes.default.svc/openid/v1/jwks
      jwk_set_bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      tls_client_ca: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    database:
      type: postgres
      host: grafana-postgres-rw.grafana-operator.svc:5432
      name: grafana
      ssl_mode: verify-full
      ca_cert_path: /etc/grafana/postgres/ca.crt
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    panels:
      disable_sanitize_html: "true"
    security:
      disable_initial_admin_creation: "true"
    plugins:
      plugin_admin_enabled: "false"
      # Bundled plugins do not need downloading.
      preinstall_auto_update: "false"
      disable_plugins: grafana-advisor-app,grafana-exploretraces-app,grafana-pyroscope-app
    server:
      enable_gzip: "true"
    unified_alerting:
      ha_peers: grafana-alerting.grafana-operator.svc:9094
      ha_advertise_address: $__env{POD_IP}:9094
  client:
    useKubeAuth: true
  disableDefaultAdminSecret: true
  # Security contexts are set in the deployment template below.
  disableDefaultSecurityContext: All
  deployment:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      replicas: 2
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      template:
        spec:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: grafana
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: grafana
              env:
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: grafana-credentials
                      key: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc
                      key: client-secret
                - name: GF_DATABASE_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-postgres-app
                      key: username
                - name: GF_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-postgres-app
                      key: password
                - name: LOGS_DRILLDOWN_VERSION
                  # renovate: datasource=github-releases depName=grafana/logs-drilldown
                  value: 3.2.0
                - name: METRICS_DRILLDOWN_VERSION
                  # renovate: datasource=github-releases depName=grafana/metrics-drilldown
                  value: 3.2.0
                - name: GF_PLUGINS_PREINSTALL
                  value: grafana-lokiexplore-app@$(LOGS_DRILLDOWN_VERSION),grafana-metricsdrilldown-app@$(METRICS_DRILLDOWN_VERSION)
                - name: TZ
                  value: ${TZ}
                - name: GF_SERVER_ROOT_URL
                  value: https://grafana.${BASE_DOMAIN}
                - name: GF_AUTH_GENERIC_OAUTH_ENABLED
                  value: "true"
                - name: GF_AUTH_GENERIC_OAUTH_NAME
                  value: Authelia
                - name: GF_AUTH_GENERIC_OAUTH_ICON
                  value: signin
                - name: GF_AUTH_GENERIC_OAUTH_SCOPES
                  value: openid profile email groups
                - name: GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES
                  value: "false"
                - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
                  value: https://auth.${BASE_DOMAIN}/api/oidc/authorization
                - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
                  value: https://auth.${BASE_DOMAIN}/api/oidc/token
                - name: GF_AUTH_GENERIC_OAUTH_API_URL
                  value: https://auth.${BASE_DOMAIN}/api/oidc/userinfo
                - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
                  value: preferred_username
                - name: GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH
                  value: groups
                - name: GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH
                  value: name
                - name: GF_AUTH_GENERIC_OAUTH_USE_PKCE
                  value: "true"
                - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
                  value: contains(groups[*], 'lldap_admin') && 'GrafanaAdmin' || ''
                # Refuse sign-in without a role.
                - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
                  value: "true"
                - name: GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN
                  value: "true"
              resources:
                requests:
                  cpu: 75m
                  memory: 200Mi
                limits:
                  cpu: 1500m
                  memory: 2400Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: postgres-ca
                  mountPath: /etc/grafana/postgres
                  readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: postgres-ca
              secret:
                secretName: grafana-postgres-ca
                items:
                  - key: ca.crt
                    path: ca.crt
  httpRoute:
    metadata:
      labels:
        gateway-role: internal
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Grafana"
        gethomepage.dev/group: "Metrics"
        gethomepage.dev/icon: "grafana.svg"
        gethomepage.dev/href: "https://grafana.${BASE_DOMAIN}"
        gethomepage.dev/weight: "10"
        gethomepage.dev/pod-selector: "app=grafana"
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: internal
          namespace: traefik-internal
          sectionName: websecure
      hostnames:
        - grafana.${BASE_DOMAIN}
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - group: ""
              kind: Service
              name: grafana-service
              port: 3000
