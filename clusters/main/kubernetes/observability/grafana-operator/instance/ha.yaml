---
apiVersion: v1
kind: Service
metadata:
  name: grafana-alerting
  namespace: grafana-operator
spec:
  clusterIP: None
  selector:
    app: grafana
  ports:
    - name: gossip-tcp
      port: 9094
      protocol: TCP
    - name: gossip-udp
      port: 9094
      protocol: UDP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grafana
  namespace: grafana-operator
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: grafana
