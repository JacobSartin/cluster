---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: grafana-operator
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: grafana-operator
    namespace: flux-system
  timeout: 20m
  driftDetection:
    mode: warn
  values:
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    podAnnotations:
      observability.jacobsartin.com/multiline-profile: stacktrace
