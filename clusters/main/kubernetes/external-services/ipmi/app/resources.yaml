---
apiVersion: v1
kind: Service
metadata:
  name: ipmi
  namespace: external-services
spec:
  ports:
    - name: https
      protocol: TCP
      port: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ipmi
  namespace: external-services
  labels:
    kubernetes.io/service-name: ipmi
    # Prevent the EndpointSlice controller from replacing manual endpoints.
    endpointslice.kubernetes.io/managed-by: cluster-gitops

addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 443
endpoints:
  - addresses:
      - "${IPMI_IP}"
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: ipmi
  namespace: external-services
  labels:
    gateway-role: internal
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: ipmi
  namespace: external-services
  labels:
    gateway-role: internal
spec:
  weighted:
    services:
      - kind: Service
        name: ipmi
        port: 443
        scheme: https
        serversTransport: ipmi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ipmi
  namespace: external-services
  labels:
    gateway-role: internal
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: "External Services"
    gethomepage.dev/href: "https://ipmi.${BASE_DOMAIN}"
    gethomepage.dev/icon: "asrock-rack-ipmi.svg"
    gethomepage.dev/name: "IPMI"
    gethomepage.dev/weight: "40"
spec:
  hostnames:
    - ipmi.${BASE_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: traefik-internal
      sectionName: websecure
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: ipmi
