apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rustfs
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik-internal
  interval: 10m
  path: clusters/main/kubernetes/external-services/rustfs/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
