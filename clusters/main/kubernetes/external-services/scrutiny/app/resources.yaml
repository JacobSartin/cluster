---
apiVersion: v1
kind: Service
metadata:
  name: scrutiny
  namespace: external-services
spec:
  ports:
    - name: http
      protocol: TCP
      port: 31054
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: scrutiny
  namespace: external-services
  labels:
    endpointslice.kubernetes.io/managed-by: cluster-gitops
    kubernetes.io/service-name: scrutiny

addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 31054
endpoints:
  - addresses:
      - "${NAS_IP}"
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scrutiny
  namespace: external-services
  labels:
    gateway-role: internal
  annotations:
    auth.jacobsartin.com/gatus-path: /api/health
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: "External Services"
    gethomepage.dev/href: "https://scrutiny.${BASE_DOMAIN}"
    gethomepage.dev/icon: "scrutiny.svg"
    gethomepage.dev/name: "Scrutiny"
    gethomepage.dev/weight: "70"
spec:
  hostnames:
    - scrutiny.${BASE_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: traefik-internal
      sectionName: websecure
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: scrutiny
          port: 31054
