---
apiVersion: v1
kind: Service
metadata:
  name: truenas
  namespace: external-services
spec:
  ports:
    - name: https
      protocol: TCP
      port: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas
  namespace: external-services
  labels:
    kubernetes.io/service-name: truenas
    # Prevent the EndpointSlice controller from replacing manual endpoints.
    endpointslice.kubernetes.io/managed-by: cluster-gitops

addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 443
endpoints:
  - addresses:
      - "${NAS_IP}"
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: truenas
  namespace: external-services
  labels:
    gateway-role: internal
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: truenas
  namespace: external-services
  labels:
    gateway-role: internal
spec:
  weighted:
    services:
      - kind: Service
        name: truenas
        port: 443
        scheme: https
        serversTransport: truenas
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: truenas
  namespace: external-services
  labels:
    auth.jacobsartin.com/authelia: bypass
    gateway-role: internal
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: "External Services"
    gethomepage.dev/href: "https://truenas.${BASE_DOMAIN}"
    gethomepage.dev/icon: "truenas.svg"
    gethomepage.dev/name: "TrueNAS"
    gethomepage.dev/weight: "50"
spec:
  hostnames:
    - truenas.${BASE_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: traefik-internal
      sectionName: websecure
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: truenas
