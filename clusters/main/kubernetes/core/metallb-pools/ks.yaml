apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-pools
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/disabled: "true"
spec:
  dependsOn:
    - name: metallb-config
  interval: 10m
  path: clusters/main/kubernetes/core/metallb-pools/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  postBuild:
    substituteFrom:
      - kind: Secret
        name: metallb-pools
