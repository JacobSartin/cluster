---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux
  namespace: private-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: private-tenant-namespace-admin
  labels:
    projectcapsule.dev/aggregate-to-controller: "true"

rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"
---
# Flux requires namespace lookup before creation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: private-tenant-owner

rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: private-tenant-owner

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: private-tenant-owner
subjects:
  - kind: ServiceAccount
    name: flux
    namespace: private-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: private-tenant-namespace-admin
  namespace: private-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: private-tenant-namespace-admin
subjects:
  - kind: ServiceAccount
    name: flux
    namespace: private-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: authelia-oidc-client-reader
  labels:
    projectcapsule.dev/aggregate-to-controller: "true"

rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - oidc-client
    verbs:
      - get
