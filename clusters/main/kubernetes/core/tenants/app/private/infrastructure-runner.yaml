---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infrastructure-runner

rules:
  - apiGroups:
      - tuppr.home-operations.com
    resources:
      - talosupgrades
      - kubernetesupgrades
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infrastructure-runner

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infrastructure-runner
subjects:
  - kind: ServiceAccount
    name: infrastructure-runner
    namespace: gha-infrastructure
