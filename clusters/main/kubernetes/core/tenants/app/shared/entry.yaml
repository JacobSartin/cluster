---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shared-cluster
  namespace: shared
spec:
  dependsOn:
    - name: tenants
      namespace: flux-system
    - name: cloudnative-pg-barman-plugin
      namespace: flux-system
    - name: cloudnative-pg-image-catalog
      namespace: flux-system
  interval: 5m
  path: ./apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: shared-cluster
  wait: true
  targetNamespace: shared
  serviceAccountName: flux
  decryption:
    provider: sops
    secretRef:
      name: shared-cluster-sops-age
