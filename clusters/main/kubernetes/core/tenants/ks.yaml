apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  dependsOn:
    - name: capsule
    - name: external-secrets-stores
  interval: 10m
  path: clusters/main/kubernetes/core/tenants/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
