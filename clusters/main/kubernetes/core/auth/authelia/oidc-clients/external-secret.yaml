# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-oidc-clients
  namespace: authelia
spec:
  refreshInterval: 5m
  target:
    name: authelia-oidc-clients
    creationPolicy: Owner
  data:
    - secretKey: clients_grafana_secret
      sourceRef:
        storeRef:
          kind: SecretStore
          name: oidc-grafana
      remoteRef:
        key: grafana-oidc
        property: client-secret-digest
    - secretKey: clients_homepage_secret
      sourceRef:
        storeRef:
          kind: SecretStore
          name: oidc-homepage
      remoteRef:
        key: homepage-auth
        property: oidc-client-secret-digest
    - secretKey: clients_private_secret
      sourceRef:
        storeRef:
          kind: SecretStore
          name: oidc-private
      remoteRef:
        key: oidc-client
        property: client-secret-digest
