---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authelia-oidc-reader
  namespace: grafana-operator

rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - grafana-oidc
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authelia-oidc-reader
  namespace: grafana-operator

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authelia-oidc-reader
subjects:
  - kind: ServiceAccount
    name: authelia-oidc-reader
    namespace: authelia
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: oidc-grafana
  namespace: authelia
spec:
  provider:
    kubernetes:
      remoteNamespace: grafana-operator
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authelia-oidc-reader
