---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: oidc-private
  namespace: authelia
spec:
  provider:
    kubernetes:
      # yaml-language-server-disable String does not match
      remoteNamespace: ${PRIVATE_OIDC_NAMESPACE}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authelia-oidc-reader
