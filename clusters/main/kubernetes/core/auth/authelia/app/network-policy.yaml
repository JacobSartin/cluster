---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authelia-egress
  namespace: authelia

specs:
  - description: Authelia to its Postgres cluster, Postgres replication between instances
    endpointSelector: {}
    egress:
      - toEndpoints:
          - {}
  - description: Authelia to LLDAP (authentication backend)
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: authelia
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: lldap
              app.kubernetes.io/name: lldap
        toPorts:
          - ports:
              - port: "3890"
                protocol: TCP
  - description: CNPG instance managers and the Barman plugin sidecar watch the API server
    endpointSelector:
      matchExpressions:
        - key: cnpg.io/cluster
          operator: Exists
    egress:
      - toEntities:
          - kube-apiserver
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP
