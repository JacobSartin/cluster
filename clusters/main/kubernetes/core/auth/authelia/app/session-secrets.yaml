# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authelia-session
  namespace: authelia
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - AUTHELIA_SESSION_SECRET
    - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
    - AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-session
  namespace: authelia
spec:
  refreshPolicy: Periodic
  refreshInterval: 2160h
  target:
    name: authelia-session
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: authelia-session
