---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  timeout: 20m
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
        target:
          kind: Deployment
          name: authelia
          namespace: authelia
      - paths:
          - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
        target:
          kind: StatefulSet
          name: authelia-valkey
          namespace: authelia
  valuesFrom:
    - kind: ConfigMap
      name: authelia-values
      valuesKey: values.yaml
