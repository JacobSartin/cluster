# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authelia-valkey
  namespace: authelia
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - VALKEY_PASSWORD
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Rotate only with a coordinated restart of all replicas.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-valkey
  namespace: authelia
spec:
  refreshPolicy: CreatedOnce
  target:
    name: authelia-valkey
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: authelia-valkey
