apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: blocky
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
    - name: metallb-pools
  interval: 10m
  path: clusters/main/kubernetes/core/blocky/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
