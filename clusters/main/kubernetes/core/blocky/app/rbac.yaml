---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blocky

rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - services
      - namespaces
    verbs:
      - list
      - watch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - "*"
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blocky

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: blocky
subjects:
  - kind: ServiceAccount
    name: blocky
    namespace: blocky
