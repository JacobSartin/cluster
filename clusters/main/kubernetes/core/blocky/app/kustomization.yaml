apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helm-release.yaml
  - rbac.yaml

configMapGenerator:
  - name: blocky-values
    namespace: blocky
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
  - name: blocky-config
    namespace: blocky
    files:
      - config.yml=config.yaml
    options:
      disableNameSuffixHash: true
  - name: blocky-corefile
    namespace: blocky
    files:
      - Corefile
    options:
      disableNameSuffixHash: true
