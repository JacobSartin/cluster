# renovate: datasource=docker depName=ghcr.io/0xerr0r/blocky
# yaml-language-server: $schema=https://raw.githubusercontent.com/0xERR0R/blocky/v0.37.0/docs/config.schema.json
upstreams:
  groups:
    default:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
      - 9.9.9.9
      - 149.112.112.112
      - 208.67.222.222
      - 208.67.220.220
      - 8.26.56.26
      - 8.20.247.20
  timeout: 1s

ports:
  dns: 53
  tls: 853
  http: 4000
  https: 4443

prometheus:
  enable: true
  path: /metrics

log:
  level: info
  format: text
  timestamp: true

minTlsServeVersion: "1.2"

caching:
  minTime: 15m
  maxTime: 0m
  maxItemsCount: 0
  prefetching: true
  prefetchExpires: 12h
  prefetchThreshold: 5
  prefetchMaxItemsCount: 0
  cacheTimeNegative: 30m

customDNS:
  customTTL: 1h
  filterUnmappedTypes: true
  mapping:
    truenas.${BASE_DOMAIN}: ${NAS_IP}

conditional:
  mapping:
    ${BASE_DOMAIN}: 127.0.0.1:5353

blocking:
  blockType: nxDomain
  blockTTL: 6h

  loading:
    refreshPeriod: 4h
    downloads:
      timeout: 60s
      writeTimeout: 60s
      readTimeout: 60s
      readHeaderTimeout: 60s
      attempts: 3
      cooldown: 5s
    concurrency: 8
    strategy: fast
    maxErrorsPerSource: 5

  allowlists:
    default:
      - https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/optional-list.txt
      - https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt
      - https://raw.githubusercontent.com/rahilpathan/pihole-whitelist/main/1.LowWL.txt

  denylists:
    default:
      - https://big.oisd.nl/domainswild
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts

  clientGroupsBlock:
    default:
      - default
