---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: renovate-gateway
  namespace: renovate
spec:
  secretName: renovate-gateway-tls
  dnsNames:
    - renovate.${BASE_DOMAIN}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: prod
    kind: ClusterIssuer
    group: cert-manager.io
