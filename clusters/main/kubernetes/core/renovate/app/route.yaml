---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/listenerset_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: renovate-webhook
  namespace: renovate
  labels:
    gateway-role: external
spec:
  parentRef:
    name: external
    namespace: traefik-external
  listeners:
    - name: https
      hostname: renovate.${BASE_DOMAIN}
      port: 8443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: renovate-gateway-tls
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: renovate-webhook
  namespace: renovate
  labels:
    gateway-role: external
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - renovate.${BASE_DOMAIN}
  parentRefs:
    # cloudflared's listener. LAN DNS and Gatus also need a Gateway parent.
    - name: external
      namespace: traefik-external
      sectionName: tunnel
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: renovate-webhook
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /webhook
      backendRefs:
        - name: renovate
          port: 80
