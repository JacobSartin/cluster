apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc.yaml
  - helm-release.yaml
  - route.yaml
  - certificate.yaml
  - credentials.sops.yaml

configMapGenerator:
  - name: renovate-values
    namespace: renovate
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
