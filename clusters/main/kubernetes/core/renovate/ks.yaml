apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate
  namespace: flux-system
spec:
  dependsOn:
    - name: longhorn
    - name: clusterissuer
    - name: traefik-external
  interval: 10m
  path: clusters/main/kubernetes/core/renovate/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
