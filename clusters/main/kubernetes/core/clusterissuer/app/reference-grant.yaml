# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/referencegrant_v1beta1.json
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-wildcard-certificate
  namespace: clusterissuer
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: traefik-internal
  to:
    - group: ""
      kind: Secret
      name: certificate-issuer-wildcard
