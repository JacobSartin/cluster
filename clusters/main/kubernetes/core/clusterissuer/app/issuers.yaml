---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: staging
spec:
  acme:
    email: "${EMAIL}"
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: staging-acme-clusterissuer-account-key
    solvers:
      - dns01:
          cloudflare:
            email: "${EMAIL}"
            apiTokenSecretRef:
              name: staging-clusterissuer-secret
              key: cf-api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: prod
spec:
  acme:
    email: "${EMAIL}"
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: prod-acme-clusterissuer-account-key
    solvers:
      - dns01:
          cloudflare:
            email: "${EMAIL}"
            apiTokenSecretRef:
              name: prod-clusterissuer-secret
              key: cf-api-token
