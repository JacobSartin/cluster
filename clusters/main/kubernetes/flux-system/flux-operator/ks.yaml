apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
  interval: 1h
  path: clusters/main/kubernetes/flux-system/flux-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: true
