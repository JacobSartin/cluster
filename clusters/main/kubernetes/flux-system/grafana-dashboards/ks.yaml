apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-grafana-dashboards
  namespace: flux-system
spec:
  dependsOn:
    - name: grafana-operator
    - name: prometheus-operator-crds
  interval: 10m
  path: clusters/main/kubernetes/flux-system/grafana-dashboards/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
