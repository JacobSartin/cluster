---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
  namespace: flux-system
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: flux-instance
    namespace: flux-system
  timeout: 20m
  driftDetection:
    mode: warn
  values:
    instance:
      distribution:
        # renovate: datasource=github-releases depName=fluxcd/flux2
        version: 2.10.1
      cluster:
        networkPolicy: true
      components:
        - source-controller
        - source-watcher
        - kustomize-controller
        - helm-controller
        - notification-controller
      sync:
        interval: 30m
        kind: GitRepository
        url: ssh://git@github.com/JacobSartin/cluster.git
        ref: refs/heads/main
        path: clusters/main/flux-entry
        name: cluster
        pullSecret: deploy-key
      kustomize:
        patches:
          -
            patch: |-
              - op: add
                path: /spec/ignore
                value: |
                  /*
                  !/clusters
                  !/repositories
            target:
              kind: GitRepository
              name: cluster
          -
            patch: |-
              apiVersion: v1
              kind: Namespace
              metadata:
                name: flux-system
                labels:
                  network.jacobsartin.com/ingress: external
            target:
              kind: Namespace
              name: flux-system
          -
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=12
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --kube-api-qps=50
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --kube-api-burst=100
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --requeue-dependency=5s
            target:
              kind: Deployment
              name: (kustomize-controller|helm-controller|source-controller)
          - # The target selector replaces this placeholder name.
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          limits:
                            memory: 2Gi
            target:
              kind: Deployment
              name: (kustomize-controller|helm-controller|source-controller)
          -
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --default-service-account=kustomize-controller
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --no-cross-namespace-refs=true
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --no-remote-bases=true
            target:
              kind: Deployment
              name: kustomize-controller
          - patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --no-cross-namespace-refs=true
            target:
              kind: Deployment
              name: source-watcher
          -
            patch: |-
              - op: replace
                path: /spec/template/spec/volumes/0
                value:
                  name: temp
                  emptyDir:
                    medium: Memory
            target:
              kind: Deployment
              name: kustomize-controller
          -
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=CancelHealthCheckOnNewRevision=true
            target:
              kind: Deployment
              name: kustomize-controller
          -
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=OOMWatch=true,CancelHealthCheckOnNewRevision=true
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --oom-watch-memory-threshold=95
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --oom-watch-interval=500ms
            target:
              kind: Deployment
              name: helm-controller
