apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: github-receiver
  namespace: flux-system
spec:
  type: github
  events:
    - ping
    - push
  secretRef:
    name: github-webhook-token-secret
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: cluster
      namespace: flux-system
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: flux-entry-repos
      namespace: flux-system
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: flux-entry
      namespace: flux-system
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: shared-cluster
      namespace: shared
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: shared-cluster
      namespace: shared
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: private-cluster
      namespace: private-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: private-cluster
      namespace: private-system
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: tuppr-plans
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: infrastructure
      namespace: flux-system
