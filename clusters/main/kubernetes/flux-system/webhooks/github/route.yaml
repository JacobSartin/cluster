---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/listenerset_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: webhook-receiver
  namespace: flux-system
  labels:
    gateway-role: external
spec:
  parentRef:
    name: external
    namespace: traefik-external
  listeners:
    - name: https
      hostname: flux-webhook.${BASE_DOMAIN}
      port: 8443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: webhook-receiver-gateway-tls
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webhook-receiver
  namespace: flux-system
  labels:
    gateway-role: external
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - flux-webhook.${BASE_DOMAIN}
  parentRefs:
    # cloudflared's listener. LAN DNS and Gatus also need a Gateway parent.
    - name: external
      namespace: traefik-external
      sectionName: tunnel
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: webhook-receiver
      sectionName: https
  rules:
    - backendRefs:
        - name: webhook-receiver
          port: 80
