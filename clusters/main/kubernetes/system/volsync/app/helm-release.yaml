apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync
spec:
  interval: 5m
  chart:
    spec:
      chart: volsync
      version: 0.17.0
      sourceRef:
        kind: HelmRepository
        name: backube
        namespace: flux-system
      interval: 5m
  values:
    metrics:
      disableAuth: true
    podAnnotations:
      observability.jacobsartin.com/multiline-profile: stacktrace
