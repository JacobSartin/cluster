apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
    - name: snapshot-controller
  interval: 10m
  path: clusters/main/kubernetes/system/volsync/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync-dashboards
  namespace: flux-system
spec:
  dependsOn:
    - name: volsync
    - name: grafana-operator
  interval: 10m
  path: clusters/main/kubernetes/system/volsync/dashboards
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
