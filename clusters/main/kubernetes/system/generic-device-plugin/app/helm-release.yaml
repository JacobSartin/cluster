---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
  namespace: generic-device-plugin
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  timeout: 20m
  driftDetection:
    mode: warn
  valuesFrom:
    - kind: ConfigMap
      name: generic-device-plugin-values
      valuesKey: values.yaml
