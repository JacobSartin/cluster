# renovate-schema: datasource=docker depName=ghcr.io/bjw-s-labs/helm/app-template registryUrl=https://ghcr.io
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/values.schema.json
---
controllers:
  main:
    type: daemonset
    forceRename: generic-device-plugin
    strategy: RollingUpdate

    pod:
      priorityClassName: system-node-critical

      tolerations:
        - operator: Exists
    containers:
      app:
        image:
          repository: ghcr.io/squat/generic-device-plugin
          # No upstream release tags; keep the digest pinned.
          tag: latest@sha256:6fd8023741b24c0302a97153605ff77f4d55535a4b5a8b0c8502b208e8310525

        args:
          - --domain
          - devic.es
          - --device
          - |-
            name: tun
            groups:
              - count: 1000
                paths:
                  - path: /dev/net/tun

        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault

        resources:
          requests:
            cpu: 50m
            memory: 10Mi
          limits:
            cpu: 50m
            memory: 20Mi

service:
  metrics:
    controller: main
    ports:
      http:
        port: 8080

persistence:
  dev:
    type: hostPath
    hostPath: /dev
    globalMounts:
      - path: /dev

  device-plugins:
    type: hostPath
    hostPath: /var/lib/kubelet/device-plugins
    globalMounts:
      - path: /var/lib/kubelet/device-plugins
