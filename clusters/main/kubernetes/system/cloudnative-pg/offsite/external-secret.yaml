# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-offsite-storage
  namespace: cnpg-offsite
spec:
  refreshInterval: 1h
  target:
    name: cnpg-offsite-storage
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        RUSTFS_ACCESS_KEY_ID: "{{ .rustfsAccessKeyId }}"
        RUSTFS_SECRET_ACCESS_KEY: "{{ .rustfsSecretAccessKey }}"
        R2_ACCESS_KEY_ID: "{{ .r2AccessKeyId }}"
        R2_SECRET_ACCESS_KEY: "{{ .r2SecretAccessKey }}"
  data:
    - secretKey: rustfsAccessKeyId
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: rustfs-credentials
      remoteRef:
        key: rustfs-credentials
        property: access-key-id
    - secretKey: rustfsSecretAccessKey
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: rustfs-credentials
      remoteRef:
        key: rustfs-credentials
        property: secret-access-key
    - secretKey: r2AccessKeyId
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: backup
      remoteRef:
        key: backup
        property: r2-access-key-id
    - secretKey: r2SecretAccessKey
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: backup
      remoteRef:
        key: backup
        property: r2-secret-access-key
