apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
  interval: 10m
  path: clusters/main/kubernetes/system/metallb/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-dashboards
  namespace: flux-system
spec:
  dependsOn:
    - name: metallb
    - name: grafana-operator
  interval: 10m
  path: clusters/main/kubernetes/system/metallb/dashboards
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
