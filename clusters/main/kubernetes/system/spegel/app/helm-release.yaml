---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
  namespace: spegel
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: spegel
    namespace: flux-system
  upgrade:
    remediation:
      strategy: rollback
      retries: 3
  values:
    serviceMonitor:
      enabled: true
    spegel:
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
      mirroredRegistries:
        - https://cgr.dev
        - https://docker.io
        - https://ghcr.io
        - https://quay.io
        - https://mcr.microsoft.com
        - https://public.ecr.aws
        - https://gcr.io
        - https://registry.k8s.io
        - https://k8s.gcr.io
        - https://oci.trueforge.org
        - https://factory.talos.dev
      prependExisting: true
      # Resolve latest upstream to avoid stale peer digests.
      registryFilters:
        - .*:latest$
