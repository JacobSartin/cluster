apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capsule
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
  interval: 10m
  path: clusters/main/kubernetes/system/capsule/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: true
