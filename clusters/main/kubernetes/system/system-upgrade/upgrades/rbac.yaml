---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tuppr-plans
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuppr-plans

rules:
  - apiGroups:
      - tuppr.home-operations.com
    resources:
      - talosupgrades
      - kubernetesupgrades
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuppr-plans

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tuppr-plans
subjects:
  - kind: ServiceAccount
    name: tuppr-plans
    namespace: flux-system
