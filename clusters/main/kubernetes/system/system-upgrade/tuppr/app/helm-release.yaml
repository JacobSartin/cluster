---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
  namespace: system-upgrade
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tuppr
    namespace: flux-system
  values:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    podAnnotations:
      observability.jacobsartin.com/multiline-profile: stacktrace
