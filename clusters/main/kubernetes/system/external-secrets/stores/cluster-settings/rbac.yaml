---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-settings-reader
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-settings-reader
  namespace: flux-system

rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - cluster-settings
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-settings-reader
  namespace: flux-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-settings-reader
subjects:
  - kind: ServiceAccount
    name: cluster-settings-reader
    namespace: flux-system
