# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: backup
spec:
  conditions:
    - namespaces:
        - actualserver
        - assettocorsa
        - bytestash
        - cnpg-offsite
        - discordgsm
        - factorio
        - minecraft
    - namespaceSelector:
        matchLabels:
          capsule.clastix.io/tenant: private
  provider:
    kubernetes:
      remoteNamespace: backup
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: backup
      auth:
        serviceAccount:
          name: backup-reader
          namespace: backup
