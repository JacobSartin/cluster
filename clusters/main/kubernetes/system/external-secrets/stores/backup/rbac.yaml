---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-reader
  namespace: backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-reader
  namespace: backup

rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-reader
  namespace: backup

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-reader
subjects:
  - kind: ServiceAccount
    name: backup-reader
    namespace: backup
