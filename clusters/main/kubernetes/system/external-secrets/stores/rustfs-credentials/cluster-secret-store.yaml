# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: rustfs-credentials
spec:
  conditions:
    - namespaces:
        - assettocorsa
        - authelia
        - cnpg-offsite
        - factorio
        - grafana-operator
        - grafana-loki
        - lldap
    - namespaceSelector:
        matchLabels:
          capsule.clastix.io/tenant: private
  provider:
    kubernetes:
      remoteNamespace: rustfs-credentials
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: rustfs-credentials
      auth:
        serviceAccount:
          name: rustfs-credentials-reader
          namespace: rustfs-credentials
