---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustfs-credentials-reader
  namespace: rustfs-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rustfs-credentials-reader
  namespace: rustfs-credentials

rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rustfs-credentials-reader
  namespace: rustfs-credentials

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rustfs-credentials-reader
subjects:
  - kind: ServiceAccount
    name: rustfs-credentials-reader
    namespace: rustfs-credentials
