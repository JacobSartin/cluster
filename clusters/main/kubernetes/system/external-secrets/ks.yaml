apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
  interval: 10m
  timeout: 10m
  path: clusters/main/kubernetes/system/external-secrets/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-stores
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
  interval: 10m
  path: clusters/main/kubernetes/system/external-secrets/stores
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: true
