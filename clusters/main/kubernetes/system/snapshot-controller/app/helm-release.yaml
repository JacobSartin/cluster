apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: snapshot-controller
spec:
  interval: 5m
  chart:
    spec:
      chart: snapshot-controller
      version: 5.4.1
      sourceRef:
        kind: HelmRepository
        name: piraeus
        namespace: flux-system
      interval: 5m
  upgrade:
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    installCRDs: true
    webhook:
      enabled: false
    controller:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
