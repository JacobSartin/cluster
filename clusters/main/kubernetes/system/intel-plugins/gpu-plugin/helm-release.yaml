apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-gpu
  namespace: intel-plugins
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: intel-device-plugins-gpu
    namespace: flux-system
  dependsOn:
    - name: intel-device-plugins-operator
      namespace: intel-plugins
  driftDetection:
    mode: enabled
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    sharedDevNum: 5
    name: intel-gpu-plugin
    nodeFeatureRule: true
