apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-operator
  namespace: intel-plugins
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: intel-device-plugins-operator
    namespace: flux-system
  dependsOn:
    - name: node-feature-discovery
      namespace: kube-system
    - name: cert-manager
      namespace: cert-manager
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values: {}
