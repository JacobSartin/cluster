apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api-crds
    - name: prometheus-operator-crds
    - name: snapshot-controller
    - name: traefik-internal
  interval: 10m
  path: clusters/main/kubernetes/system/longhorn/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-jobs
  namespace: flux-system
spec:
  dependsOn:
    - name: longhorn
  interval: 10m
  path: clusters/main/kubernetes/system/longhorn/jobs
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
