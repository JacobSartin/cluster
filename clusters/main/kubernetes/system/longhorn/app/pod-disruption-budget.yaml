apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: csi-resizer
  namespace: longhorn-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: csi-resizer
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: csi-snapshotter
  namespace: longhorn-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: csi-snapshotter
